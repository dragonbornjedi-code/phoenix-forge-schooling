name: schooling-assemble-debug
on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Note
        run: |
          echo "Full assemble needs composite builds (kit/theme/data/widget) as siblings."
          echo "On Crucible, run: ./gradlew :app:assembleDebug"
          test -f settings.gradle.kts
          test -f docs/roadmaps/00_MASTER_ROADMAP.md
